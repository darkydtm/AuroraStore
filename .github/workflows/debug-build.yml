name: Build Debug APK

# Builds an installable debug APK on every push and pull request.
# Debug builds are signed with the committed AOSP test key, so no secrets are needed.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble vanilla debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Assemble debug APK
        run: ./gradlew assembleVanillaDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-store-vanilla-debug
          path: app/build/outputs/apk/vanilla/debug/*.apk
          if-no-files-found: error
