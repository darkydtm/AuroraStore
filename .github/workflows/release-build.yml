name: Build Release APK

# Manually triggered ("Run workflow" button on the Actions tab) release build.
#
# Signing (optional): add these repository secrets to get a signed APK, otherwise
# an unsigned release APK is produced.
#   KEYSTORE_BASE64 - base64 of your keystore: `base64 -w0 keystore.jks`
#   KEY_ALIAS       - key alias
#   KEY_PASSWORD    - key (and store) password; build.gradle.kts reuses it for both

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the APK'
        type: boolean
        default: false
      tag:
        description: 'Release tag (default: v<versionName>-<run number>)'
        required: false
        default: ''

permissions:
  contents: write # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble vanilla release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          cat > app/signing.properties <<EOF
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          STORE_FILE=keystore.jks
          EOF
          echo "Signing configured: release APK will be signed."

      - name: Warn about unsigned build
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: echo "::warning::No KEYSTORE_BASE64 secret set — producing an UNSIGNED release APK."

      - name: Assemble release APK
        run: ./gradlew assembleVanillaRelease

      - name: Read version name
        id: version
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v${{ steps.version.outputs.name }}-${{ github.run_number }}"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-store-vanilla-release
          path: app/build/outputs/apk/vanilla/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: app/build/outputs/apk/vanilla/release/*.apk
